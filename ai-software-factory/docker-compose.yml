version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=factorydb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - FACTORY_WORKSPACE=/workspace
      - GIT_REMOTE_URL=https://github.com/ishantbhatia/AIEndToEndSolutionGIt.git
      - GIT_USERNAME=ishantbhatia
      - GIT_PASSWORD=${GIT_PASSWORD:-}
    volumes:
      - workspace-data:/workspace
    depends_on:
      - postgres
      - ollama

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  workspace-data:
  pg-data:
  ollama-data:
